name: iOS Build

on:
  push:
    branches:
      - main
      - v2.0.6
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Add or sync Capacitor iOS
        run: |
          if [ ! -d ios ]; then
            npx cap add ios --no-interactive
          fi
          npx cap sync ios

      - name: Install signing certificate and provisioning profile
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k ~/Library/Keychains/build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security set-keychain-settings -t 3600 -u ~/Library/Keychains/build.keychain

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          PROV_UUID=$(xmllint --xpath 'string(//key[.="UUID"]/following-sibling::string[1])' /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "~/Library/MobileDevice/Provisioning Profiles/${PROV_UUID}.mobileprovision"

          security find-identity -v -p codesigning
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Archive iOS app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos archive -archivePath $PWD/build/App.xcarchive DEVELOPMENT_TEAM=${{ secrets.APPLE_DEVELOPMENT_TEAM }} PROVISIONING_PROFILE_SPECIFIER='${{ secrets.APPLE_PROVISIONING_PROFILE_SPECIFIER }}' CODE_SIGN_IDENTITY='${{ secrets.CODE_SIGN_IDENTITY }}' CODE_SIGN_STYLE=Manual
        env:
          CI: true

      - name: Export IPA
        run: |
          cd ios/App
          cat <<'EOF' > exportOptions.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>ad-hoc</string>
  <key>compileBitcode</key>
  <false/>
  <key>signingStyle</key>
  <string>manual</string>
</dict>
</plist>
EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/App
        env:
          CI: true

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/build/App/App.ipa
